[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nes-agents"
version = "0.1.0"
description = "Train AI agents to play NES games on nes-emulator-cpp"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    # Builds nes_py from source (needs a C++23 compiler, CMake and Ninja). Bump the tag deliberately.
    "nes-emulator-cpp @ git+https://github.com/StevenH34/nes-emulator-cpp@v0.1.0",
    "gymnasium~=1.4",
    "numpy",
]

[project.optional-dependencies]
train = [
    "torch",
    # Pinned exactly: PPOWithPrior overrides PPO.train() with a modified copy of this version's code.
    "stable-baselines3==2.9.0",
    "tensorboard",
]
play = ["opencv-python"]
export = ["onnx", "onnxruntime"]
test = ["pytest"]

[project.urls]
Emulator = "https://github.com/StevenH34/nes-emulator-cpp"

# The dependency on nes-emulator-cpp is a direct git reference.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["nes_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
